name: Lab 6 Coverage Checks

on:
  push:
    paths:
      - "lab6/**"
      - ".github/workflows/lab6-coverage.yml"
  pull_request:
    paths:
      - "lab6/**"
      - ".github/workflows/lab6-coverage.yml"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest coverage
      - name: Run line coverage tests
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q CodeCoverageTest_traffic_fine.py
          python -m coverage report -m traffic_fine.py
      - name: Run branch coverage tests
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q BranchCoverageTest_traffic_fine.py
          python -m coverage report -m traffic_fine.py
